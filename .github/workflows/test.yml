name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# GitHub forces JS actions onto Node 24 from 2026-06-16 (Node 20 removed 2026-09-16). Opt in now so
# any incompatibility surfaces in CI rather than after the cutover. Remove once the pinned action
# versions natively ship on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Design-system guardrail: no raw spacing .dp in UI code. Pure grep, ~seconds. ──
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design-token guardrail
        run: bash tools/check-design-tokens.sh

  # ── Screenshot regression (Roborazzi on Robolectric, no emulator). ──
  # NON-GATING for now: goldens were recorded on macOS/JBR; ubuntu/temurin font AA may
  # diff slightly. Diffs upload as artifacts. Promote to gating after a CI re-record
  # (run recordRoborazziFossDebug on this image, commit those goldens). See UI_PROGRESS.md.
  screenshot:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Generate gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Verify design-system screenshots
        run: ./gradlew :app:verifyRoborazziFossDebug --no-daemon --stacktrace
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 14

  # ── Fast layer: pure-JVM + Robolectric unit tests. No emulator, runs on every push. ──
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Generate gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testFossDebugUnitTest --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 14

  # ── Slow layer: instrumented smoke tests on a real emulator across API levels. ──
  # Skipped on PRs (expensive); runs on pushes to main and manual dispatch.
  instrumented:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34]   # minSdk, mid, near-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # No setup-android here: the runner image ships the SDK and emulator-runner installs the
      # system images it needs. setup-android's package downloads were flaking with corrupt zips.
      - name: Generate gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedFossDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
