<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{margin:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const { ThemeScope, Mascot } = window.AscendyDesignSystem_01b7f9;
function Cell({ theme, locked }) {
  return <ThemeScope theme={theme} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '16px 8px' }}>
    <Mascot variant={theme} locked={locked} size={120} bob={!locked} />
    <span style={{ fontSize: 12, color: 'var(--smoke)', textTransform: 'var(--type-heading-transform)' }}>{locked ? 'focusing' : 'idle'}</span>
  </ThemeScope>;
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex' }}>
    <Cell theme="kawaii" locked={false} /><Cell theme="kawaii" locked={true} />
    <Cell theme="tough" locked={false} /><Cell theme="tough" locked={true} />
    <Cell theme="neutral" locked={false} /><Cell theme="neutral" locked={true} />
  </div>
);
</script></body></html>
