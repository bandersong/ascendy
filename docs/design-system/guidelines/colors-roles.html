<!-- @dsCard group="Colors" viewport="700x200" name="Semantic roles" subtitle="How the 10 roles map to jobs — same names in every theme" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0}
.wrap{display:flex;gap:10px;padding:14px;background:var(--cream);font-family:var(--font-sans);min-height:100vh}
.col{flex:1;display:flex;flex-direction:column;gap:6px}
.demo{border-radius:12px;padding:10px 12px;font-size:12px;font-weight:500}
.cap{font-size:10px;color:var(--smoke);font-family:monospace}
</style></head><body><div class="wrap">
<div class="col"><div class="demo" style="background:var(--surface);border:1px solid var(--mist);color:var(--ink)">card on Surface, Mist hairline, Ink text</div><span class="cap">--surface-card / --divider / --text-body</span>
<div class="demo" style="background:var(--cloud);color:var(--smoke)">soft surface with muted text</div><span class="cap">--surface-soft / --text-muted</span></div>
<div class="col"><div class="demo" style="background:var(--petal);color:var(--on-petal)">primary action on Petal</div><span class="cap">--accent / --on-accent</span>
<div class="demo" style="background:var(--sage);color:var(--ink)">success · done</div><span class="cap">--success (Sage)</span>
<div class="demo" style="background:var(--lilac);color:var(--ink)">focusing status</div><span class="cap">--accent-2 (Lilac)</span></div>
</div></body></html>
