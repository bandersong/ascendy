<!-- @dsCard group="Brand" viewport="700x220" name="Marks & app icons" subtitle="ascendy-star.svg recolors + themed launcher tiles — never redraw" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0}
.wrap{display:flex;gap:10px;padding:14px;min-height:100vh;font-family:var(--font-sans)}
.cell{flex:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.cell img{width:80px;height:80px}
.cell span{font-size:10px;font-family:monospace}
.ti{border-radius:18px}
</style></head><body><div class="wrap">
<div class="cell" style="background:#9D40CE"><img src="../assets/marks/ascendy-star.svg" alt=""><span style="color:#FBF7FF">ascendy-star.svg</span></div>
<div class="cell" style="background:#ECE9E1"><img src="../assets/marks/ascendy-star-slate.svg" alt=""><span style="color:#565249">-slate.svg</span></div>
<div class="cell" style="background:#1E1428"><img src="../assets/marks/ascendy-star-orchid.svg" alt=""><span style="color:#C4A8D4">-orchid.svg</span></div>
<div class="cell" style="background:#070708"><img src="../assets/marks/ascendy-star-bone.svg" alt=""><span style="color:#9C958A">-bone.svg</span></div>
<div class="cell" style="background:var(--cream);border:1px solid var(--mist)">
<div style="display:flex;gap:8px">
<img class="ti" src="../assets/theme-icons/theme_icon_kawaii.png" alt="" style="width:52px;height:52px">
<img class="ti" src="../assets/theme-icons/theme_icon_tough.png" alt="" style="width:52px;height:52px">
<img class="ti" src="../assets/theme-icons/theme_icon_neutral.png" alt="" style="width:52px;height:52px">
</div><span style="color:var(--smoke)">theme_icon_*.png</span></div>
</div></body></html>
