<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ascendy brand mark — the 5-point star + two dot eyes.
  Viewport 108×108, star centered at (54,54).
  White fill on transparent bg; eyes #3D3142.
  Swap the star fill for any theme colorway (orchid / bone / slate).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Star -->
  <path fill="#FFFFFF"
        d="M54,28 L60.5,46.5 L80,49 L65,62 L69.5,82 L54,71.5 L38.5,82 L43,62 L28,49 L47.5,46.5 Z" />
  <!-- Left eye -->
  <circle cx="48" cy="54" r="2" fill="#3D3142" />
  <!-- Right eye -->
  <circle cx="60" cy="54" r="2" fill="#3D3142" />
</svg>
